# GitHub Pages へのデプロイ（takaho9/cycling-route-finder のリポジトリルートに置く想定）
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # build-data.yml（都内データの週次生成）から呼ぶ。GITHUB_TOKEN の push では push トリガーが起動しないため（v1.3）
  workflow_call:
    inputs:
      ref:
        description: 'デプロイするコミット（省略時はトリガーのコミット）'
        type: string
        required: false
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_call では呼び出し元が push したデータ更新コミットを指定する。push / 手動実行では従来どおり
          ref: ${{ inputs.ref || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      - name: Build (base = /cycling-route-finder/)
        run: npm run build
        env:
          BASE_PATH: /cycling-route-finder/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
